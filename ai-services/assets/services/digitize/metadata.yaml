# Service identification
id: digitize
version: "1.0.0"
name: "Digitize documents"
description: "Converts physical and scanned documents into searchable, editable digital formats; enables efficient document management, data extraction, and workflow automation at scale."
type: service

# Certification and support
certified_by: "IBM"

# Service belongs to these architectures
architectures:
  - rag

standalone: true
accepts_datasource: true

# About field containing detailed service information
about:
  - title: "Service details"
    sections:
      - title: "Version"
        value: "1.0.0"

  - title: "Inputs and outputs"
    sections:
      - title: "Inputs"
        values:
          - "Document files (e.g., PDFs)"
      - title: "Outputs"
        values:
          - "Texts digitized from input documents"
          - "Pointers to digitized input documents"

  - title: "Content and format support"
    sections:
      - title: "Languages"
        values:
          - "English"
          - "French"
          - "German"
          - "Italian"
      - title: "Document formats"
        values:
          - "PDF"
          - "DOCX"
      - title: "Content"
        values:
          - "Text"
          - "Tables"

  - title: "Expected resource consumption"
    sections:
      - title: "per 5 concurrent users"
        values:
          - title: "Compute"
            value: "19 CPU cores"
          - title: "Memory"
            value: "162.50 GB"
          - title: "Storage"
            value: "90.00 GB"
          - title: "Spyre acceleration cards"
            value: 4

  - title: "Assets"
    sections:
      - title: "Source code"
        ctaLabel: "View source code"
        url: "https://github.com/IBM/project-ai-services"

