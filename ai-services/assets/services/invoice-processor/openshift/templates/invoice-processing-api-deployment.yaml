apiVersion: apps/v1
kind: Deployment
metadata:
  name: "invoice-processing-api"
  labels:
    ai-services.io/service: {{ .Release.Name }}
    ai-services.io/template: {{ .Values.templateID }}
    ai-services.io/version: {{ default .Chart.AppVersion | quote }}
spec:
  replicas: 1
  selector:
    matchLabels:
      ai-services.io/service: {{ .Release.Name }}
      ai-services.io/component: invoice-processing-api
  template:
    metadata:
      labels:
        ai-services.io/service: {{ .Release.Name }}
        ai-services.io/template: {{ .Values.templateID }}
        ai-services.io/component: invoice-processing-api
        ai-services.io/component-type: api
        ai-services.io/version: {{ default .Chart.AppVersion | quote }}
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: invoice-processing-db-wait
          image: "{{ .Values.postgres.image }}"
          command:
            - "/bin/sh"
            - "-c"
            - |
              RETRIES=0
              MAX_RETRIES=60
              until pg_isready -h invoice-processing-db -p 5432; do
                RETRIES=$((RETRIES + 1))
                if [ "$RETRIES" -ge "$MAX_RETRIES" ]; then
                  echo "ERROR: invoice-processing-db did not become ready after $((MAX_RETRIES * 5)) seconds. Giving up."
                  exit 1
                fi
                echo "Waiting for invoice-processing-db to be ready... ($RETRIES/$MAX_RETRIES)"
                sleep 5
              done
        - name: invoice-processing-db-init
          image: "{{ .Values.invoiceProcessing.image }}"
          command:
            - "/var/venv/bin/python"
            - "db/scripts/init_db.py"
          env:
            - name: POSTGRES_HOST
              value: "invoice-processing-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.invoiceProcessing.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "invoice-processing-db-secret"
                  key: password
      containers:
        - name: invoice-processing-api
          image: "{{ .Values.invoiceProcessing.image }}"
          command:
            - "/var/venv/bin/python"
            - "-m"
            - "uvicorn"
            - "app:app"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "4100"
            - "--loop"
            - "uvloop"
            - "--http"
            - "httptools"
          env:
            - name: POSTGRES_HOST
              value: "invoice-processing-db"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "{{ .Values.invoiceProcessing.database }}"
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "invoice-processing-db-secret"
                  key: password
            - name: DB_POOL_SIZE
              value: "5"
            - name: DB_MAX_OVERFLOW
              value: "5"
            - name: DIGITIZE_URL
              value: http://digitize-api:4000
            - name: EXTRACT_URL
              value: http://extract-api:9500
            - name: LOG_LEVEL
              value: "{{ .Values.invoiceProcessing.log_level }}"
          ports:
            - containerPort: 4100
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: {{ .Values.invoiceProcessing.resources.requests.cpu | quote }}
              memory: {{ .Values.invoiceProcessing.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.invoiceProcessing.resources.limits.cpu | quote }}
              memory: {{ .Values.invoiceProcessing.resources.limits.memory | quote }}
          volumeMounts:
            - mountPath: /var/cache
              name: cache
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: invoice-processing-cache
