# Service identification
id: invoice-processing
version: "1.0.0"
name: "Invoice processing"
description: "Automates end-to-end invoice handling by extracting structured data from PDF and image invoices and loading results into a target ERP or database system."
type: service

# Certification and support
certified_by: "IBM"

# Service belongs to these architectures
architectures:
  - rag

# Dependencies on other components
dependencies:
  - id: llm

standalone: true

# About field containing detailed service information
about:
  - title: "Service details"
    sections:
      - title: "Version"
        value: "1.0.0"
      - title: "Large language model (LLM)"
        value: "granite-3.3-8b-instruct"
      - title: "Inference backend"
        values:
          - "Red Hat AI Inference with Spyre"
          - "AI Inference on CPU"
          - "IBM watsonx.ai on IBM Cloud"

  - title: "Inputs and outputs"
    sections:
      - title: "Inputs"
        values:
          - "Invoice files (PDF or image)"
      - title: "Outputs"
        values:
          - "Structured invoice data (JSON)"
          - "DB load status"

  - title: "Dependencies and integration"
    sections:
      - title: "External dependencies"
        values:
          - "Digitize service (required for PDF invoices — converts scanned pages to text)"
          - "Extract service (required — performs structured field extraction)"
          - "Inferencing endpoint compatible with OpenAI or similar AI APIs (required for LLM-based extraction)"

  - title: "Content and format support"
    sections:
      - title: "Languages"
        values:
          - "English"
      - title: "Document formats"
        values:
          - "PDF"
          - "PNG / JPEG"

  - title: "Expected resource consumption"
    sections:
      - title: "per 5 concurrent users"
        values:
          - title: "Compute"
            value: "2 CPU cores"
          - title: "Memory"
            value: "4.50 GB"
          - title: "Storage"
            value: "10.00 GB"

  - title: "Assets"
    sections:
      - title: "Source code"
        ctaLabel: "View source code"
        url: "https://github.com/IBM/project-ai-services"

